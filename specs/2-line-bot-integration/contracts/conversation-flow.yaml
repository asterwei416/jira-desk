## 驗證規則詳細定義

### 1. 問題標題（Subject）

```csharp
public bool ValidateSubject(string subject, out string errorMessage)
{
    if (string.IsNullOrWhiteSpace(subject))
    {
        errorMessage = "問題標題不可為空白";
        return false;
    }
    
    if (subject.Length > 100)
    {
        errorMessage = "問題標題不可超過 100 字元";
        return false;
    }
    
    errorMessage = null;
    return true;
}
```

**錯誤回應**: 「問題標題不可為空白，請重新輸入。」

---

### 2. 問題內容（Content）

```csharp
public bool ValidateContent(string content, out string errorMessage)
{
    if (string.IsNullOrWhiteSpace(content))
    {
        errorMessage = "問題內容不可為空白";
        return false;
    }
    
    if (content.Length > 500)
    {
        errorMessage = "問題內容不可超過 500 字元";
        return false;
    }
    
    errorMessage = null;
    return true;
}
```

**錯誤回應**: 「問題內容不可超過 500 字元，請精簡描述。」

---

### 3. 問題所屬單位（InquirySystem）

```csharp
public async Task<bool> ValidateInquirySystem(int inquirySystemId, out string errorMessage)
{
    var inquirySystem = await _inquirySystemRepository.GetByIdAsync(inquirySystemId);
    if (inquirySystem == null)
    {
        errorMessage = "所選單位不存在";
        return false;
    }
    
    errorMessage = null;
    return true;
}
```

**特殊情況**: InquirySystem 超過 13 個選項

```csharp
public async Task<object> CreateInquirySystemQuickReply()
{
    var inquirySystems = await _inquirySystemRepository.GetAllAsync();
    
    if (inquirySystems.Count() > 13)
    {
        // 拒絕回報並引導至網頁
        return new
        {
            type = "text",
            text = "選項過多，請至網頁端回報問題\n" +
                   $"{_webBaseUrl}/call-records/create"
        };
    }
    
    // 正常顯示 Quick Reply
    return new
    {
        type = "text",
        text = "請選擇問題所屬單位：",
        quickReply = new
        {
            items = inquirySystems.Select(s => new
            {
                type = "action",
                action = new
                {
                    type = "postback",
                    label = s.Name,
                    data = $"inquiry_system:{s.Id}"
                }
            }).ToArray()
        }
    };
}
```

