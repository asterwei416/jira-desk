## 對話逾時處理

### 逾時策略

- **逾時時間**: 5 分鐘（從 LastActivityAt 計算）
- **檢查頻率**: BackgroundService 每 1 分鐘檢查一次
- **逾時行為**: 清除 ConversationState，使用者需重新啟動流程

```csharp
// CallTrackingSystem.Infrastructure/Services/ConversationCleanupService.cs
protected override async Task ExecuteAsync(CancellationToken stoppingToken)
{
    while (!stoppingToken.IsCancellationRequested)
    {
        try
        {
            var timeout = TimeSpan.FromMinutes(5);
            using var scope = _serviceProvider.CreateScope();
            var stateService = scope.ServiceProvider
                .GetRequiredService<ConversationStateService>();

            stateService.CleanupExpiredStates(timeout);
        }
        catch (Exception ex)
        {
            _logger.LogError(ex, "對話狀態清理失敗");
        }

        await Task.Delay(TimeSpan.FromMinutes(1), stoppingToken);
    }
}
```

