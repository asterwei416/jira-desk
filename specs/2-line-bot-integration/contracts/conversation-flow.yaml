## 狀態持久化策略

**重要**: 對話狀態**不持久化至資料庫**，僅儲存於 In-Memory ConcurrentDictionary。

### 重啟影響

- ✅ 應用程式重啟時，所有對話狀態將遺失
- ✅ 使用者需重新啟動回報流程
- ✅ 此為刻意的設計取捨（符合憲法「不使用 Redis」原則）

### 單實例限制

- ⚠️ 本功能僅支援單實例部署環境
- ⚠️ 不支援負載平衡或多實例部署
- ⚠️ 在 quickstart.md 中明確標註此限制
