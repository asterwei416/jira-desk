### 4. 聯絡電話（ContactPhone）

```csharp
public bool ValidateContactPhone(string phone, out string errorMessage)
{
    // 移除空白與 - 符號
    var cleanPhone = phone.Replace(" ", "").Replace("-", "");
    
    // 台灣手機格式：09xx-xxx-xxx（10 碼）
    if (Regex.IsMatch(cleanPhone, @"^09\d{8}$"))
    {
        errorMessage = null;
        return true;
    }
    
    // 台灣市話格式：0x-xxxx-xxxx（9-10 碼）
    if (Regex.IsMatch(cleanPhone, @"^0\d{1,2}\d{7,8}$"))
    {
        errorMessage = null;
        return true;
    }
    
    errorMessage = "電話格式不正確";
    return false;
}
```

**錯誤回應**: 「電話格式不正確，請輸入正確的手機號碼（例：0912-345-678）或市話（例：02-1234-5678）」

