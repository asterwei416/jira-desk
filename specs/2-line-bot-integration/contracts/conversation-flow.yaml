# Conversation Flow State Machine

**Version**: 1.0.0  
**Purpose**: 定義 LINE Bot 對話回報問題的狀態機契約

---

## 狀態定義

```csharp
public enum ConversationStep
{
    Idle = 0,                    // 閒置狀態
    AwaitingSubject = 1,         // 等待問題標題
    AwaitingContent = 2,         // 等待問題內容
    AwaitingInquirySystem = 3,   // 等待選擇所屬單位
    AwaitingUrgencyLevel = 4,    // 等待選擇緊急程度
    AwaitingContactName = 5,     // 等待聯絡人姓名
    AwaitingContactPhone = 6,    // 等待聯絡電話
    AwaitingConfirmation = 7     // 等待確認送出
}
```

---

## 狀態轉移表

| 當前狀態 | 觸發事件 | 驗證規則 | 下一狀態 | Bot 回應 |
|---------|---------|---------|---------|---------|
| Idle | 使用者輸入「回報問題」 | 檢查使用者是否已綁定 LINE | AwaitingSubject | 「您好！請問要回報什麼問題呢？請輸入問題標題。」 |
| AwaitingSubject | 使用者輸入文字 | 長度 1-100 字元 | AwaitingContent | 「收到，問題標題為『{subject}』。請描述問題的詳細內容：」 |
| AwaitingContent | 使用者輸入文字 | 長度 1-500 字元 | AwaitingInquirySystem | 顯示 InquirySystem Quick Reply 選單 |
| AwaitingInquirySystem | 使用者點擊 Quick Reply | 檢查 InquirySystemId 存在 | AwaitingUrgencyLevel | 顯示緊急程度 Quick Reply（🟢 低、🟡 中、🔴 高） |
| AwaitingUrgencyLevel | 使用者點擊 Quick Reply | UrgencyLevel 為 Low/Medium/High | AwaitingContactName | 「請提供顧客聯絡人姓名：」 |
| AwaitingContactName | 使用者輸入文字 | 長度 1-50 字元 | AwaitingContactPhone | 「請提供顧客聯絡電話：」 |
| AwaitingContactPhone | 使用者輸入文字 | 符合台灣手機/市話格式 | AwaitingConfirmation | 顯示摘要 + 確認按鈕 |
| AwaitingConfirmation | 使用者點擊「確認送出」 | - | Idle | 「✅ 回報單已成功建立！回報單號：#{id}」 + 查看連結 |
| Any | 使用者輸入「取消」 | - | Idle | 「已取消回報流程」 |

