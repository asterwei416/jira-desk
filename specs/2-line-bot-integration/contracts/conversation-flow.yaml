## 取消流程

### 使用者隨時輸入「取消」

```csharp
public async Task HandleCancellationAsync(string lineUserId)
{
    _conversationStateService.ClearState(lineUserId);
    
    await _lineApiClient.SendReplyMessageAsync(lineUserId, new
    {
        type = "text",
        text = "已取消回報流程，如需重新回報請輸入「回報問題」"
    });
}
```

