## 本地開發設定

### 使用 ngrok 測試 OAuth Callback

```powershell
# 1. 啟動應用程式
dotnet run --project src/CallTrackingSystem.Web

# 2. 啟動 ngrok
ngrok http 5000

# 3. 更新 appsettings.Development.json
{
  "LineLogin": {
    "CallbackUrl": "https://abc123.ngrok.io/auth/line-callback"
  }
}

# 4. 在 LINE Developers Console 設定 Callback URL
# https://abc123.ngrok.io/auth/line-callback
```
